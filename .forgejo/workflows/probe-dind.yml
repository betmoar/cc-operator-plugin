name: probe-dind
on:
  push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: can the job reach a docker daemon, and does a bind mount see the workspace?
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          if ! command -v docker >/dev/null; then echo "RESULT: no docker CLI in the job image"; exit 0; fi
          docker version --format '{{.Server.Version}}' 2>&1 | head -2 || echo "RESULT: no daemon reachable"
          echo "--- bind mount test ---"
          echo "PWD=$PWD"; ls scripts/lib/ | head -3
          docker run --rm -v "$PWD":/w -w /w alpine:3 sh -c 'echo "inside:"; ls /w/scripts/lib/ 2>&1 | head -3' \
            || echo "RESULT: bind mount FAILED"
