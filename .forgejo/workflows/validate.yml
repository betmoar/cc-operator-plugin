name: validate

# The Forgejo half of the gate. Same suites, same pinned shellcheck, different
# executor — and the differences below are not stylistic, they are the two
# things that make a GitHub workflow wrong on this forge.
#
# 1. `uses:` MUST be fully qualified. Without a host Forgejo resolves to
#    data.forgejo.org and pulls DIFFERENT code than GitHub — verified in a real
#    job log (`git clone 'https://data.forgejo.org/actions/checkout'`).
#    The cost: `act` cannot parse that form ("Expected format {org}/{repo}@ref"),
#    so this file is NOT act-runnable. That is deliberate and unavoidable — no
#    spelling satisfies both. Dry-run .github/workflows/validate.yml with act;
#    this file is proven by pushing to `lokaal`.
#
# 2. No `docker run` inside a step. The GitHub copy pins shellcheck by running
#    the koalaman image. That form CANNOT work here, and it is measured rather
#    than assumed: a probe job on this runner reported `DOCKER_HOST=<unset>`
#    and no docker CLI in the job image. The host does run a
#    `forgejo-runner-dind` container with `DOCKER_HOST=tcp://runner-dind:2375`
#    — but that is the RUNNER's daemon, used to start job containers, and the
#    job itself inherits neither the variable nor a client. A `docker run`
#    step here fails on missing infrastructure, which reports something other
#    than the code. The tarball is the same pinned 0.10.0 with no daemon at
#    all, and it is why this step carries arch detection: the runner is
#    aarch64 (measured), so the x86_64 tarball would not execute.

on:
  push:
  pull_request:
  # See the GitHub copy's comment — `pull_request_target:` is what makes the
  # base-gate job run this file from the base ref. (Forgejo's runner support
  # for the target event is the one genuinely unmeasured surface here; the
  # job is `if:`-guarded so a forge that never fires it simply never runs it,
  # and check_base_gate pins its presence, not its execution.)
  pull_request_target:

jobs:
  validate:
    runs-on: ubuntu-latest
    # Same reasoning as the GitHub copy: no __pycache__ anywhere. `unittest
    # discover` leaves 2 (scripts/ and tests/), both gitignored, so git status
    # stays clean while the tree is not. Job level, not per step, so a later
    # step that adds a python call inherits it.
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: https://github.com/actions/checkout@v4

      # The runner image is not guaranteed to carry these. Install explicitly
      # rather than discovering a missing binary as a mystery failure three
      # steps later — and print the versions, because "which bash ran this"
      # is the first question a divergence between the two forges raises.
      - name: Toolchain
        run: |
          set -e
          if ! command -v python3 >/dev/null || ! command -v node >/dev/null \
             || ! command -v jq >/dev/null || ! command -v git >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq python3 nodejs jq git curl xz-utils
          fi
          echo "bash    $BASH_VERSION"
          echo "python  $(python3 --version)"
          echo "node    $(node --version)"
          echo "arch    $(uname -m)"

      # PINNED to 0.10.0, the same version the GitHub gate uses and NOT the
      # one a maintainer has locally: 0.11 stopped failing on SC2015 while
      # 0.9/0.10 still do, so five commits reported "shellcheck clean" from a
      # 0.11 workstation while every CI run went red on the same bytes.
      #
      # The glob covers scripts/lib/ explicitly. `scripts/*.sh` does not match
      # it, so lib/autobar.sh shipped through three CI paths unlinted (#86
      # review). Keep both terms.
      - name: Shellcheck gate scripts
        run: |
          set -e
          case "$(uname -m)" in
            aarch64|arm64) SC_ARCH=aarch64 ;;
            x86_64|amd64)  SC_ARCH=x86_64 ;;
            *) echo "unsupported arch $(uname -m) for the pinned shellcheck tarball"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.${SC_ARCH}.tar.xz" \
            | tar -xJf - -C /tmp
          /tmp/shellcheck-v0.10.0/shellcheck --version | grep version:
          /tmp/shellcheck-v0.10.0/shellcheck scripts/*.sh scripts/lib/*.sh tests/test-scripts.sh

      # Every rung goes through gate-suite.sh, never the raw command — it
      # requires the rung's completion MARKER (exit 0 is also what a step that
      # ran nothing returns) and holds the case count to tests/floors.env.
      #
      # The prose that used to live here is why the file exists: "local macOS
      # runs 683; a rootful ubuntu container runs 675 (8 self-skips); a count
      # BELOW those is a real regression". Measured 2026-09-03 on a rootful
      # ubuntu container: 820. The comment was stale by ~145 cases and nothing
      # noticed, because nothing read it. The executor spread it describes is
      # real and is now permanent slack under the floor, documented there.
      - name: Validate plugin contracts
        run: bash scripts/gate-suite.sh validator

      - name: Run Python tests
        run: bash scripts/gate-suite.sh python

      - name: Run shell script tests
        run: bash scripts/gate-suite.sh shell

      - name: Run workflow logic tests
        run: bash scripts/gate-suite.sh workflows

      - name: Run compressor replay tests
        run: bash scripts/gate-suite.sh compress

  # The trusted half of #108, the Forgejo mirror of the GitHub base-gate job.
  # Same rule: the job checks out the BASE ref only, fetches the PR head, and
  # reads it through `git show`/`git diff` — never a checkout. `uses:` is
  # host-qualified per this file's header rule (data.forgejo.org otherwise
  # resolves the name against DIFFERENT code).
  base-gate:
    # See the GitHub copy: `pull_request` reads this file and every script it
    # calls FROM THE PR HEAD (the loop this job breaks); only
    # `pull_request_target` reads them from the base. MEASURED here, task 483
    # on 2026-09-05: with the guard on `pull_request` the job ran under the
    # untrusted event — Forgejo fires `pull_request` for a PR and this job
    # went with it. Whether this forge fires `pull_request_target` at all is
    # STILL unmeasured (no such row exists yet; a PR that ADDS a
    # pull_request_target workflow cannot trigger it, because the base has no
    # copy to run). If it never fires here, this job simply never runs on
    # Forgejo and the GitHub half carries the gate — a job that does not run
    # is honest; one that runs from the PR head is not.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Fetch the PR head (never checked out)
        run: |
          set -e
          git fetch --no-tags --depth=1 origin \
            "${{ github.event.pull_request.head.sha }}"
      - name: Trusted base-ref gate (#108)
        run: |
          set -e
          # BOOTSTRAP — see the GitHub copy. Until this lands on the default
          # branch the BASE has no base-gate.sh and the step exits 127
          # (measured, task 483). Nothing trusted exists to weaken yet.
          if [ ! -f scripts/base-gate.sh ]; then
            echo "BASE_GATE_BOOTSTRAP: the base ref carries no scripts/base-gate.sh"
            echo "  — nothing trusted to run yet (expected only until #108 lands)."
            exit 0
          fi
          bash scripts/base-gate.sh \
            --base "${{ github.event.pull_request.base.sha }}" \
            --pr  "${{ github.event.pull_request.head.sha }}"
