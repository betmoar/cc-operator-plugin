name: base-gate

# ONLY the trusted event, and that is the whole mechanism. Under
# `pull_request` this file AND scripts/base-gate.sh would both be read from
# the PR head — the self-judging loop #108 exists to break. The job used to
# live in validate.yml behind `if: github.event_name == 'pull_request_target'`;
# a workflow that never receives the untrusted event cannot run under it at
# all, which is a structural guard rather than a string a reviewer must read.
#
# It also removes a measured duplicate: with both triggers on validate.yml,
# EVERY push produced two full runs of the ~4.5 minute suite (PR #132, head
# 0501ec7: runs 35081274929 and 35081274847, both green, both complete).
#
# Whether this forge fires `pull_request_target` at all is still unmeasured
# (no such row exists yet; a PR that adds a pull_request_target workflow
# cannot trigger it, because the base has no copy to run). If it never fires
# here, this job simply never runs on Forgejo and the GitHub half carries the
# gate — a job that does not run is honest; one that runs from the PR head is
# not.
on:
  pull_request_target:

jobs:
  base-gate:
    runs-on: ubuntu-latest
    # Least privilege, and on THIS event it is not boilerplate:
    # `pull_request_target` runs with the base repo's token rather than a
    # fork's, so the default repo-wide scope (often `contents: write`) would
    # be handed to a job whose whole subject is untrusted code. The job only
    # ever READS git objects. Pinned here so a future step that adds an API
    # call has to widen this deliberately instead of inheriting the reach.
    permissions:
      contents: read
    steps:
      # host-qualified per this file's header rule (data.forgejo.org
      # otherwise resolves the bare name against DIFFERENT code).
      - uses: https://github.com/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # FULL history. `git merge-tree` needs a merge base, and a depth-1
          # checkout has no ancestors to find one in (#130).
          fetch-depth: 0
      - name: Fetch the PR head (never checked out)
        run: |
          set -e
          # NOT --depth=1: a truncated fetch leaves objects merge-tree cannot
          # read, and that failure returns the same rc as a conflict.
          git fetch --no-tags origin \
            "${{ github.event.pull_request.head.sha }}"
      - name: Trusted base-ref gate (#108)
        run: |
          set -e
          # BOOTSTRAP. A pull_request_target workflow is read from the BASE
          # branch, so until this lands on the default branch the base has no
          # base-gate.sh and the step exits 127 ("command not found"), which
          # reads as a broken runner rather than "there is no gate here yet"
          # (measured on Forgejo, task 483). Reported and PASSED, not failed:
          # with no trusted enforcer at the base there is nothing to weaken,
          # and failing closed would block the very PR that adds the gate.
          # Self-limiting — once merged the base always has it, and a PR
          # DELETING it is caught by the delete arm in the base's own copy.
          if [ ! -f scripts/base-gate.sh ]; then
            echo "BASE_GATE_BOOTSTRAP: the base ref carries no scripts/base-gate.sh"
            echo "  — nothing trusted to run yet. Expected ONLY until #108 lands on"
            echo "  the default branch; after that, this line means the gate was"
            echo "  deleted from the base."
            exit 0
          fi
          bash scripts/base-gate.sh \
            --base "${{ github.event.pull_request.base.sha }}" \
            --pr  "${{ github.event.pull_request.head.sha }}"
