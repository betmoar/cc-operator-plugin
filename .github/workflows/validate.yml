name: validate

on:
  push:
    branches: [main]
  pull_request:
  # The base-gate job's trigger. `pull_request:` checks out and runs the PR's
  # own files; `pull_request_target:` runs THIS file (and the scripts it
  # calls) from the base ref with a PR context — which is what makes the
  # trusted-subject split possible. Both are listed: the ordinary jobs use
  # the PR checkout, base-gate uses the target context and guards itself
  # with `if: github.event_name == 'pull_request_target'` so both the push run
  # and the untrusted `pull_request` run skip it (on a push there is no PR to
  # judge and FETCH_HEAD would be wrong; under `pull_request` this file and
  # base-gate.sh would come from the PR head, which is the loop being broken
  # — measured on Forgejo, task 483).
  pull_request_target:

jobs:
  validate:
    runs-on: ubuntu-latest
    # No __pycache__ anywhere. Measured: the validator writes none (it is run as
    # a script, not imported), but `unittest discover` and `pytest` each leave 2
    # — scripts/ and tests/ — and those are gitignored, so `git status` stays
    # clean while the tree is not. That is the #23 family in miniature: stale
    # bytecode is the canonical example of build state a tracked-tree check
    # cannot see, and this suite has no business generating it.
    #
    # Set at JOB level, not per step: a later step that adds a python call
    # inherits it, which is the failure mode a per-step env invites.
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      # The runner's shellcheck is whatever ubuntu-latest ships, and that is NOT
      # what a maintainer runs locally: 0.11 stopped failing on SC2015 while
      # 0.9/0.10 still do, so five commits reported "shellcheck clean" from a
      # 0.11 workstation while every CI run went red on the same bytes. Pin it,
      # and print the version so a future divergence is visible in the log
      # rather than inferred from a mysterious failure.
      - name: Shellcheck gate scripts
        run: |
          docker run --rm -v "$PWD":/w -w /w koalaman/shellcheck-alpine:v0.10.0 \
            sh -c 'shellcheck --version | grep version:; shellcheck scripts/*.sh scripts/lib/*.sh tests/test-scripts.sh'
      # Every rung goes through gate-suite.sh, never the raw command. Exit 0 is
      # the weakest claim a suite makes: it is also what a step that ran nothing
      # returns. The wrapper additionally requires the rung's completion MARKER
      # and holds its case count to tests/floors.env — see that file for the
      # comment-that-was-not-a-floor this replaces. check_suite_floors pins that
      # no raw invocation comes back here to bypass it.
      - name: Validate plugin contracts
        run: bash scripts/gate-suite.sh validator
      - name: Run Python tests
        run: bash scripts/gate-suite.sh python
      - name: Run shell script tests
        run: bash scripts/gate-suite.sh shell
      - name: Run workflow logic tests
        run: bash scripts/gate-suite.sh workflows
      - name: Run compressor replay tests
        run: bash scripts/gate-suite.sh compress

  # The trusted half of #108. Every step above runs from the PR's OWN
  # checkout, so a branch that neuters a pin, drops a check, or lowers a
  # floor edits the code that grades it. This job never checks the PR head
  # out: it runs from the BASE ref (the default branch as CI sees it), only
  # FETCHES the PR, and reads PR content exclusively through `git show` /
  # `git diff` — trusted code, untrusted subject. base-gate.sh fails closed
  # on an unreadable base (it never falls back to the branch's copy).
  # `pull_request_target` is what makes the workflow file and the script it
  # runs come from main, not from the PR — that is the entire point, and it
  # is why this job must never gain a `checkout` of the head or a
  # PR-supplied ref outside `github.event.pull_request.head.sha`.
  base-gate:
    # `pull_request_target`, NOT `pull_request` — the difference IS the
    # mechanism. Under `pull_request` the workflow file and every script it
    # calls come from the PR HEAD, which is the self-judging loop this job
    # exists to break; only under `pull_request_target` do both come from the
    # base. The first draft of #108 had this guard on `pull_request` and the
    # consequence was MEASURED on Forgejo (task 483, 2026-09-05): the job ran
    # under the untrusted event and would have been skipped under the trusted
    # one. Both spellings read as deliberate, so check_base_gate pins it.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base only: shallow is enough — base-gate reads `origin/main`'s
          # tree via git show and the PR head via the fetch below.
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Fetch the PR head (never checked out)
        run: |
          set -e
          git fetch --no-tags --depth=1 origin \
            "${{ github.event.pull_request.head.sha }}"
      - name: Trusted base-ref gate (#108)
        run: |
          set -e
          # BOOTSTRAP. A pull_request_target workflow is read from the BASE
          # branch, so until this lands on the default branch the base has no
          # base-gate.sh and the step exits 127 ("command not found"), which
          # reads as a broken runner rather than "there is no gate here yet"
          # (measured on Forgejo, task 483). Reported and PASSED, not failed:
          # with no trusted enforcer at the base there is nothing to weaken,
          # and failing closed would block the very PR that adds the gate.
          # Self-limiting — once merged the base always has it, and a PR
          # DELETING it is caught by the delete arm in the base's own copy.
          if [ ! -f scripts/base-gate.sh ]; then
            echo "BASE_GATE_BOOTSTRAP: the base ref carries no scripts/base-gate.sh"
            echo "  — nothing trusted to run yet. Expected ONLY until #108 lands on"
            echo "  the default branch; after that, this line means the gate was"
            echo "  deleted from the base."
            exit 0
          fi
          bash scripts/base-gate.sh \
            --base "${{ github.event.pull_request.base.sha }}" \
            --pr  "${{ github.event.pull_request.head.sha }}"
