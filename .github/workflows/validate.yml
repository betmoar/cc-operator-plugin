name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck gate scripts
        run: shellcheck scripts/*.sh tests/test-scripts.sh
      - name: Validate plugin contracts
        run: python3 scripts/validate_plugin.py
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Run shell script tests
        run: bash tests/test-scripts.sh
      - name: Run workflow logic tests
        run: node tests/test_workflows.mjs
      - name: Run compressor replay tests
        run: node tests/test_compress.mjs
