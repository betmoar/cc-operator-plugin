name: release

# Cutting a release (see CLAUDE.md): merge to main with plugin.json version
# bumped and its `## [x.y.z]` entry newest in CHANGELOG.md, then push a tag
# `v<x.y.z>`. This workflow fails the tag build on any mismatch, re-runs the
# full validation, and publishes a GitHub release whose body is that
# version's CHANGELOG section.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Same reasoning as validate.yml: `unittest discover` leaves 2 __pycache__
    # dirs, gitignored, so the tree is dirty in a way `git status` cannot show.
    # It matters more here — this job runs the gate that decides what ships.
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Gate — tag == plugin.json version == newest CHANGELOG heading
        run: python3 scripts/release_gate.py "$GITHUB_REF_NAME" --notes-out release-notes.md

      - name: Shellcheck gate scripts
        # Pinned, same as validate.yml — the runner's own shellcheck version
        # drifts and disagrees with a maintainer's local one (SC2015 in 0.10 vs
        # 0.11). A release must not fail, or pass, on a linter nobody chose.
        run: |
          docker run --rm -v "$PWD":/w -w /w koalaman/shellcheck-alpine:v0.10.0 \
            sh -c 'shellcheck --version | grep version:; shellcheck scripts/*.sh scripts/lib/*.sh tests/test-scripts.sh'

      # Same wrapper validate.yml uses, so the PUBLISHING build carries the
      # floors and the run-markers too (#38 keeps this job a superset). A
      # release that gates less than a PR is the shape that check exists for.
      - name: Validate plugin contracts
        run: bash scripts/gate-suite.sh validator

      - name: Run Python tests
        run: bash scripts/gate-suite.sh python

      - name: Run shell script tests
        run: bash scripts/gate-suite.sh shell

      - name: Run workflow logic tests
        run: bash scripts/gate-suite.sh workflows

      - name: Run compressor replay tests
        run: bash scripts/gate-suite.sh compress

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
